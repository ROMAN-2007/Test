<body>
<form action="update_photo.php" method="POST" enctype="multipart/form-data">
    <div class="photo-container">
        <img id="preview" src="<?php echo $user['photo_profil'] ?? 'default.jpg'; ?>" alt="Photo" class="photo">
        <label for="fileInput" class="add-photo">+</label>
        <input type="file" id="fileInput" name="photo" accept="image/*" style="display:none;">
    </div>
    <button type="submit">Mettre à jour la photo</button>
</form>

<script>
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');

    fileInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = e => preview.src = e.target.result;
            reader.readAsDataURL(file);
        }
    });
</script>

</body>

</html>
